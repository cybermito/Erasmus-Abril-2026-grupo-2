<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unidades de Medida</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Unidades de Medida</h1>

    <!-- COMPARACIÓN DE UNIDADES DE MEDIDA -->
    <div class="container">
      <!-- PX: ABSOLUTA - FIJA -->
      <div class="box box-px">
        <h2>px (200px)</h2>
        <p>Tamaño absoluto - fijo</p>
      </div>
    </div>

    <!-- %: RELATIVO AL PADRE -->
    <div class="box box-percent">
      <h2>% (50%)</h2>
      <p>Mitad del padre</p>
    </div>

    <!-- REM: RELATIVO AL ROOT -->
    <div class="box box-rem">
      <h2>REM (15rem)</h2>
      <p>Relativo al root (HTML)</p>
    </div>

    <!-- EM: RELATIVO AL ELEMENTO PADRE -->
    <div class="box box-em">
      <h2>EM: (10em)</h2>
      <p>Relativo al elemento padre</p>
    </div>

    <!-- VW: VIEWPORT WIDTH -->
    <div class="box box-vw">
      <h2>VW (30vw)</h2>
      <p>30% del ancho del viewport</p>
    </div>

    <!-- VH: VIEWPORT HEIGHT -->
    <div class="box box-vh">
      <h2>VH (20vh)</h2>
      <p>20% del alto del viewport</p>
    </div>
  </body>
</html>
